dataset: CA1M

experiment:
  seed: 0

# P2 is an identity observer on top of the frozen CA-1M P1 protocol.  The
# online controller may collect Mask-RGBD evidence, but every output mutation
# is disabled.  ScanNet-B6 is loaded only by the offline counterfactual tool.
data:
  datadir: /extra/ZhaoX/boxfusion_ca1m/_placeholder/42446540
  start: 0
  output_dir: /data/ZhaoX/BoxFusion/tools/boxfusion_tr3d_pipeline/results/ca1m_port/ca1m_c2_b6_zeroshot_observer_fixed10_v2
  gap: 20

cam:
  H: 384
  W: 512
  png_depth_scale: 1000.0

detection:
  score_thresh: 0.4
  uv_bound: true
  uv_bound_value: 0.9
  floor_mask: true
  floor_ratio: 15
  scale_box: 1.5

# This block is byte-for-byte equivalent in semantics to P1: replay the
# frozen CuTR proposals and apply the same Selective Boxer G0 gate.
lifting:
  backend: boxer
  proposal_cache:
    mode: replay
    namespace: ca1m-score04-gap20-c0-v2
    root: /data/ZhaoX/BoxFusion/tools/boxfusion_tr3d_pipeline/cache/ca1m_cutr_proposals
    baseline_prediction_root: /data/ZhaoX/BoxFusion/tools/boxfusion_tr3d_pipeline/results/ca1m_port/c0_original_fixed10_v2
  boxer:
    mode: active
    apply_stage: post_filter
    official_root: /data/ZhaoX/OVM3D-Dett/boxfusion_boxer_dev/third_party/boxer
    checkpoint: /data/ZhaoX/OVM3D-Dett/boxfusion_boxer_dev/third_party/boxer/ckpts/boxernet_hw960in2x6d768-c88128f8.ckpt
    expected_commit: 1f86542dc342a4b1d474c87c97c5d1d6566d9148
    checkpoint_sha256: d5a30b348a8f5b0e5990ff3aa0e8f473ce77d860da22586322e7f47abc83ca6f
    dinov3_sha256: 4057cbaaad8c16657adb09d6815f28d4164eeba30532fde23f0d17313124caea
    precision: bfloat16
    use_sdp: true
    sdp_samples: 10000
    seed: 0
    diagnostics_dir: /data/ZhaoX/BoxFusion/tools/boxfusion_tr3d_pipeline/diagnostics/ca1m_port/ca1m_c2_b6_zeroshot_observer_fixed10_v2/boxer
    selective_gate:
      enabled: true
      max_center_shift_m: 0.10
      min_volume_ratio: 0.50
      max_volume_ratio: 2.00

association:
  small_threshold: 0.2
  rotation_gap: 30
  translation_gap: 0.8

box_fusion:
  use: true
  iters: 20
  pst_path: /data/ZhaoX/BoxFusion/data/pst_1024_0.tiff
  pst_size: 1024
  random_opt:
    center_init_size: 0.1
    center_scaling_coefficient: 0.1
    shape_init_size: 0.5
    shape_scaling_coefficient: 0.5
  check_valid: false
  nms_threshold: 0.1
  small_size: 0.5

online_refinement:
  enabled: true
  # CA-1M is evaluated with world OBBs.  Internally B6 features use the
  # enclosing AABB, but the identity path returns the original OBB corners.
  scannet_axis_aligned_only: false
  inference_every_keyframes: 5
  candidate_lifecycle:
    ttl_clock: provider_call
    archive_confirmed: false
  appearance_memory:
    enabled: true
    masked_crop: true
  supplemental_proposals:
    enabled: true
    provider: yoloe
    mode: prompt_free
    checkpoint: /data/ZhaoX/OVM3D-Dett/boxfusion_stage3_dev/models/yoloe-11s-seg-pf.pt
    prompts: []
    confidence: 0.15
    iou: 0.70
    image_size: 640
    max_detections: 64
    mask_threshold: 0.5
    agnostic_nms: true
    # Measure the real observer cost and avoid coupling this experiment to a
    # pre-existing proposal cache.  P2 remains create-only at the run level.
    cache:
      enabled: false
      write: false
      directory: null
  object_memory:
    enabled: true
    min_depth: 0.15
    max_depth: 8.0
    # CA1MDataset already converts uint16 millimetres to metres.
    depth_scale: 1.0
    mask_threshold: 0.5
    mask_edge_margin: 1
    depth_edge_threshold: 0.12
    voxel_size: 0.02
    max_points_per_observation: 2048
    max_points_per_object: 8192
    aabb_lower_quantile: 0.02
    aabb_upper_quantile: 0.98
    min_points_for_aabb: 96
    minimum_aabb_dimension: 0.05
    min_confirmations: 2
    track_ttl: 3
    association_iou_threshold: 0.05
    association_center_distance: 0.75
    association_inside_fraction: 0.25
  matching:
    global_match_iou: 0.05
    global_match_2d_iou: 0.20
    max_center_distance: 0.75
    crop_to_global_expansion: 1.50
    rekey_iou: 0.50
    absorb_supplemental_iou: 0.35
  refit:
    enabled: false
    min_views: 2
    min_points: 192
    blend: 0.70
    extent_padding: 0.02
    max_center_shift_ratio: 0.60
    min_extent_ratio: 0.35
    max_extent_ratio: 2.50
    min_original_point_support: 0.20
    min_reprojection_iou: 0.15
    min_reprojection_improvement: -0.02
  box_refiner:
    enabled: false
    checkpoint: null
    point_count: 512
    min_quality: 0.20
    architecture:
      point_feature_dim: 3
      quality_feature_dim: 12
      point_hidden_dim: 64
      point_embedding_dim: 128
      head_hidden_dim: 128
      max_center_fraction: 0.25
      max_log_dimension_residual: 0.4054651081081644
      minimum_dimension: 0.001
      normalized_point_limit: 4.0
  quality:
    enabled: false
    mode: heuristic
    checkpoint: null
    blend_with_detector: 0.60
    preserve_original_floor: false
    apply_to_unobserved: false
    support_reference_points: 8192
    target_views: 3
    max_view_records: 5
    soft_nms:
      enabled: false
      method: gaussian
      iou_threshold: 0.30
      sigma: 0.50
      score_threshold: 0.05
      max_detections: null
  supplemental_output:
    enabled: false
    min_confirmations: 2
    min_score: 0.15
    min_projection_iou: 0.0
    drop_if_global_iou: 0.70
    drop_if_supplemental_iou: 0.70
  output_filter:
    minimum_extent: 0.0
  diagnostics:
    enabled: true
    dump_track_memory: true
    root: /data/ZhaoX/BoxFusion/tools/boxfusion_tr3d_pipeline/diagnostics/ca1m_port/ca1m_c2_b6_zeroshot_observer_fixed10_v1/online
    point_count: 512

vis:
  rerun: false
  show_class: false
  show_label: false
  trajectory: true

eval: true
