dataset: CA1M

experiment:
  seed: 0

# Train-only collection template for the final CA-1M base anchor.  The runner
# reuses only the immutable CA train100 CuTR proposal cache; every new output,
# log, diagnostic, identity anchor, and report lives in this new namespace.
data:
  datadir: /extra/ZhaoX/boxfusion_ca1m_native_b6_train100_v1/_placeholder/00000000
  start: 0
  output_dir: /data/ZhaoX/BoxFusion/tools/boxfusion_tr3d_pipeline/results/ca1m_native_final_base_train100_v1/final_base
  gap: 20

cam:
  H: 384
  W: 512
  png_depth_scale: 1000.0

detection:
  score_thresh: 0.4
  uv_bound: true
  uv_bound_value: 0.9
  floor_mask: true
  floor_ratio: 15
  scale_box: 1.5

lifting:
  backend: boxer
  proposal_cache:
    mode: replay
    namespace: ca1m-native-b6-train100-score04-gap20-cutr-v1
    root: /data/ZhaoX/BoxFusion/tools/boxfusion_tr3d_pipeline/cache/ca1m_native_b6_train100_v1
    baseline_prediction_root: /data/ZhaoX/BoxFusion/tools/boxfusion_tr3d_pipeline/results/ca1m_native_b6_train100_v1/cutr_record
  boxer:
    mode: active
    apply_stage: post_filter
    official_root: /data/ZhaoX/OVM3D-Dett/boxfusion_boxer_dev/third_party/boxer
    checkpoint: /data/ZhaoX/OVM3D-Dett/boxfusion_boxer_dev/third_party/boxer/ckpts/boxernet_hw960in2x6d768-c88128f8.ckpt
    expected_commit: 1f86542dc342a4b1d474c87c97c5d1d6566d9148
    checkpoint_sha256: d5a30b348a8f5b0e5990ff3aa0e8f473ce77d860da22586322e7f47abc83ca6f
    dinov3_sha256: 4057cbaaad8c16657adb09d6815f28d4164eeba30532fde23f0d17313124caea
    precision: bfloat16
    use_sdp: true
    sdp_samples: 10000
    seed: 0
    diagnostics_dir: /data/ZhaoX/BoxFusion/tools/boxfusion_tr3d_pipeline/diagnostics/ca1m_native_final_base_train100_v1/boxer
    selective_gate:
      enabled: true
      max_center_shift_m: 0.10
      min_volume_ratio: 0.50
      max_volume_ratio: 2.00

association:
  small_threshold: 0.2
  rotation_gap: 30
  translation_gap: 0.8
  appearance_gate:
    enabled: true
    geometry_min_iou: 0.08
    hard_geometry_iou: 0.45
    low_similarity: 0.45
    high_similarity: 0.75
    max_iou_penalty: 0.10
    max_iou_bonus: 0.0
    confidence_floor: 0.35
    confidence_full: 0.75
    spatial:
      low_similarity: 0.65
      high_similarity: 0.85
    correspondence:
      low_similarity: 0.55
      high_similarity: 0.75

box_fusion:
  use: true
  iters: 20
  pst_path: /data/ZhaoX/BoxFusion/data/pst_1024_0.tiff
  pst_size: 1024
  random_opt:
    center_init_size: 0.1
    center_scaling_coefficient: 0.1
    shape_init_size: 0.5
    shape_scaling_coefficient: 0.5
  check_valid: false
  nms_threshold: 0.1
  small_size: 0.5
  reliable_views:
    enabled: true
    top_k: 3
    min_views: 3
    confidence_power: 1.0
    area_power: 0.25
    area_reference_ratio: 0.02
    projection_iou_power: 0.50
    geometry_consistency_power: 0.50
    center_sigma: 0.75
    size_sigma: 0.50
    minimum_box_diagonal: 0.10
    minimum_weight: 0.05

online_refinement:
  enabled: false

ca1m_native_b6_observer:
  enabled: false

vis:
  rerun: false
  show_class: false
  show_label: false
  trajectory: true

# Serialization only.  The train100 runner has no evaluator/GT code path.
eval: true
