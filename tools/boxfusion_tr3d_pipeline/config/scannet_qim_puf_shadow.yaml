dataset: scannet

# Both modules are strictly causal observers.  They do not modify BoxFusion
# association, boxes, scores, categories, or CLIP features.
moon_qim_lite:
  enabled: true
  observer_only: true
  voxel_size_m: 0.30
  samples_per_axis: 3
  neighbor_radius: 1
  max_candidates_per_query: 8
  max_tracks: 1024
  track_ttl_keyframes: 80
  max_postings_per_key: 32

puf_lite:
  enabled: true
  observer_only: true
  top_k: 3
  birth_likelihood: 0.40
  center_sigma: 0.50
  center_margin_m: 0.05
  shared_key_power: 1.0
  max_tracks: 1024
  exhaustive_fallback: true
  probability_tolerance: 1.0e-12
  snapshot_tolerance: 1.0e-5
  epsilon: 1.0e-9
  max_diagnostic_examples: 64

data:
  datadir: ./data/scannet_val/scene0011_01/frames
  start: 0
  output_dir: ./results/scannet_qim_puf_shadow
  gap: 25

cam:
  H: 480
  W: 640
  fx: 574.540771
  fy: 577.583740
  cx: 322.522827
  cy: 238.558853
  png_depth_scale: 1000.

detection:
  score_thresh: 0.5
  uv_bound: true
  uv_bound_value: 0.9
  floor_mask: true
  floor_ratio: 15
  scale_box: 1.5

association:
  small_threshold: 0.1
  rotation_gap: 30
  translation_gap: 0.8

box_fusion:
  use: true
  iters: 20
  pst_path: ./data/pst_1024_0.tiff
  pst_size: 1024
  random_opt:
    center_init_size: 0.1
    center_scaling_coefficient: 0.1
    shape_init_size: 0.5
    shape_scaling_coefficient: 0.5
  check_valid: false
  nms_threshold: 0.1
  small_size: 0.35

vis:
  rerun: false
  show_class: false
  show_label: false
  trajectory: true

eval: true
