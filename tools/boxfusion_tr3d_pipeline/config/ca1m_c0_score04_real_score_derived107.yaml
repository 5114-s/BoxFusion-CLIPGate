dataset: CA1M

data:
  # Non-canonical 107-scene overlay.  The 103 author-published scenes are
  # immutable links to the canonical data root; four scenes use separately
  # derived GT and must never be reported as the paper's official protocol.
  # The official demo.py replaces the final two path components with --seq.
  datadir: /extra/ZhaoX/boxfusion_ca1m_derived107_v1/_placeholder/42446540
  start: 0
  output_dir: /data/ZhaoX/BoxFusion/tools/boxfusion_tr3d_pipeline/results/ca1m_repro/c0_score04_real_score_derived107_v1
  gap: 20

cam:
  H: 384
  W: 512
  png_depth_scale: 1000.0

detection:
  # Corrected C0 protocol: filter at 0.4 and export the detector confidence.
  score_thresh: 0.4
  uv_bound: true
  uv_bound_value: 0.9
  floor_mask: true
  floor_ratio: 15
  scale_box: 1.5

association:
  small_threshold: 0.2
  rotation_gap: 30
  translation_gap: 0.8

box_fusion:
  use: true
  iters: 20
  pst_path: /data/ZhaoX/BoxFusion/data/pst_1024_0.tiff
  pst_size: 1024
  random_opt:
    center_init_size: 0.1
    center_scaling_coefficient: 0.1
    shape_init_size: 0.5
    shape_scaling_coefficient: 0.5
  check_valid: false
  nms_threshold: 0.1
  small_size: 0.5

vis:
  rerun: false
  show_class: false
  show_label: false
  trajectory: true

eval: true
