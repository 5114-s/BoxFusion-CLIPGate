dataset: scannet

data:
  # demo.py rewrites this to <root>/<--seq>/frames.
  datadir: /extra/ZhaoX/MultiScan/boxfusion_smoke/placeholder/frames
  start: 0
  output_dir: /data/ZhaoX/BoxFusion/results/multiscan_smoke
  gap: 1

cam:
  H: 192
  W: 256
  # The loader reads the converted per-scene intrinsic_depth.txt. These are
  # only fallbacks required by the configuration schema.
  fx: 192.0
  fy: 192.0
  cx: 128.0
  cy: 96.0
  png_depth_scale: 1000.0

detection:
  score_thresh: 0.5
  uv_bound: true
  uv_bound_value: 0.9
  floor_mask: true
  floor_ratio: 15
  scale_box: 1.5

association:
  small_threshold: 0.1
  rotation_gap: 30
  translation_gap: 0.8

box_fusion:
  use: true
  iters: 20
  pst_path: ./data/pst_1024_0.tiff
  pst_size: 1024
  random_opt:
    center_init_size: 0.1
    center_scaling_coefficient: 0.1
    shape_init_size: 0.5
    shape_scaling_coefficient: 0.5
  check_valid: false
  nms_threshold: 0.1
  small_size: 0.35

vis:
  rerun: false
  show_class: false
  show_label: false
  trajectory: false

eval: true
