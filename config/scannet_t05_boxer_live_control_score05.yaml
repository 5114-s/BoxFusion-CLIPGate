dataset: scannet

experiment:
  seed: 0

# Runtime denominator: identical live path, with native CuTR lifting.
data:
  datadir: /data/ZhaoX/BoxFusion/upstream_clean/scannet_readme_frames/scene0169_00/frames
  start: 0
  output_dir: /data/ZhaoX/BoxFusion/results/scannet_t05_boxer_live_control_score05
  gap: 25

cam:
  H: 480
  W: 640
  fx: 574.540771
  fy: 577.583740
  cx: 322.522827
  cy: 238.558853
  png_depth_scale: 1000.

detection:
  score_thresh: 0.5
  uv_bound: true
  uv_bound_value: 0.9
  floor_mask: true
  floor_ratio: 15
  scale_box: 1.5

lifting:
  backend: cutr

association:
  small_threshold: 0.1
  rotation_gap: 30
  translation_gap: 0.8
  appearance_gate:
    enabled: false

box_fusion:
  use: true
  iters: 20
  pst_path: /data/ZhaoX/BoxFusion/data/pst_1024_0.tiff
  pst_size: 1024
  random_opt:
    center_init_size: 0.1
    center_scaling_coefficient: 0.1
    shape_init_size: 0.5
    shape_scaling_coefficient: 0.5
  check_valid: false
  nms_threshold: 0.1
  small_size: 0.35
  reliable_views:
    enabled: true
    top_k: 3
    min_views: 3
    confidence_power: 1.0
    area_power: 0.25
    area_reference_ratio: 0.02
    projection_iou_power: 0.50
    geometry_consistency_power: 0.50
    center_sigma: 0.75
    size_sigma: 0.50
    minimum_box_diagonal: 0.10
    minimum_weight: 0.05

vis:
  rerun: false
  show_class: false
  show_label: false
  trajectory: true

eval: true
