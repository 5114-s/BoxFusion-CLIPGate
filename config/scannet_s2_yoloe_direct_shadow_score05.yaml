dataset: scannet

experiment:
  seed: 0

# S2 is an observer-only run beside the frozen T05 protocol.  The nested run
# calls the frozen CuTR path only to drive its online observer; that diagnostic
# native output is never used as the formal prefix.  The terminal materializer
# reads the already completed T05 files, while YOLOE-PF sees only the current
# RGB-D keyframe and cannot mutate that frozen prefix.
data:
  datadir: /data/ZhaoX/BoxFusion/upstream_clean/scannet_readme_frames/scene0169_00/frames
  start: 0
  output_dir: /data/ZhaoX/BoxFusion/results/scannet_s2_yoloe_direct_shadow_score05
  post_process_min_extent: 0.30
  gap: 25

cam:
  H: 480
  W: 640
  fx: 574.540771
  fy: 577.583740
  cx: 322.522827
  cy: 238.558853
  png_depth_scale: 1000.0

detection:
  score_thresh: 0.5
  uv_bound: true
  uv_bound_value: 0.9
  floor_mask: true
  floor_ratio: 15
  scale_box: 1.5

lifting:
  backend: cutr
  proposal_cache:
    mode: disabled
    namespace: ""
    root: /data/ZhaoX/BoxFusion/cache/cutr_postfilter_v3

association:
  small_threshold: 0.1
  rotation_gap: 30
  translation_gap: 0.8
  appearance_gate:
    enabled: false

box_fusion:
  use: true
  iters: 20
  pst_path: /data/ZhaoX/BoxFusion/data/pst_1024_0.tiff
  pst_size: 1024
  random_opt:
    center_init_size: 0.1
    center_scaling_coefficient: 0.1
    shape_init_size: 0.5
    shape_scaling_coefficient: 0.5
  check_valid: false
  nms_threshold: 0.1
  small_size: 0.35
  reliable_views:
    enabled: true
    top_k: 3
    min_views: 3
    confidence_power: 1.0
    area_power: 0.25
    area_reference_ratio: 0.02
    projection_iou_power: 0.50
    geometry_consistency_power: 0.50
    center_sigma: 0.75
    size_sigma: 0.50
    minimum_box_diagonal: 0.10
    minimum_weight: 0.05

online_refinement:
  enabled: true
  scannet_axis_aligned_only: true
  inference_every_keyframes: 1
  candidate_lifecycle:
    ttl_clock: provider_call
    archive_confirmed: true
  appearance_memory:
    enabled: false
    masked_crop: true
  supplemental_proposals:
    enabled: true
    provider: yoloe
    mode: prompt_free
    checkpoint: /data/ZhaoX/OVM3D-Dett/boxfusion_b6_selective_boxer_dev/models/yoloe-11s-seg-pf.pt
    prompts: []
    confidence: 0.25
    iou: 0.70
    image_size: 640
    max_detections: 64
    mask_threshold: 0.50
    agnostic_nms: true
    cache:
      enabled: false
      write: false
      directory: null
  object_memory:
    enabled: true
    min_depth: 0.10
    max_depth: 6.00
    # The ScanNet capture stream already converts uint16 depth to metres.
    depth_scale: 1.0
    mask_threshold: 0.50
    mask_edge_margin: 1
    depth_edge_threshold: 0.15
    voxel_size: 0.02
    max_points_per_observation: 2048
    max_points_per_object: 8192
    aabb_lower_quantile: 0.02
    aabb_upper_quantile: 0.98
    min_points_for_aabb: 8
    minimum_aabb_dimension: 0.02
    # S2 uses a past/current-only third-view receipt, not a two-view birth.
    min_confirmations: 3
    track_ttl: 10
    association_iou_threshold: 0.05
    association_center_distance: 0.75
    association_inside_fraction: 0.25
  matching:
    # Keep the universal-proposal branch independent of the slightly
    # nondeterministic native replay.  Frozen T05 overlap is applied later by
    # the terminal shadow materializer, never inside this observer run.
    global_match_iou: 1.0
    global_match_2d_iou: 1.0
    max_center_distance: 0.000001
    crop_to_global_expansion: 1.0
    rekey_iou: 1.0
    absorb_supplemental_iou: 1.0
  refit:
    enabled: false
    min_views: 2
    min_points: 192
    blend: 0.70
    extent_padding: 0.02
    max_center_shift_ratio: 0.60
    min_extent_ratio: 0.35
    max_extent_ratio: 2.50
    min_original_point_support: 0.20
    min_reprojection_iou: 0.15
    min_reprojection_improvement: -0.02
  box_refiner:
    enabled: false
    checkpoint: null
    device: null
    point_count: 512
    min_quality: 0.20
    architecture: {}
  quality:
    enabled: false
    mode: heuristic
    checkpoint: null
    blend_with_detector: 0.60
    preserve_original_floor: false
    apply_to_unobserved: false
    support_reference_points: 8192
    target_views: 3
    max_view_records: 5
    soft_nms:
      enabled: false
      method: gaussian
      iou_threshold: 0.30
      sigma: 0.50
      score_threshold: 0.05
      max_detections: null
  supplemental_output:
    # This emits a counterfactual sidecar/prediction suffix only.  It is not
    # authorization to mutate or replace the frozen T05 prediction tree.
    enabled: true
    min_confirmations: 3
    min_score: 0.25
    min_projection_iou: 0.30
    # Exact native overlap is disabled here; frozen-T05 novelty IoU is checked
    # in the separate terminal materializer.
    drop_if_global_iou: 1.0
    drop_if_supplemental_iou: 0.70
  output_filter:
    minimum_extent: 0.30
  diagnostics:
    enabled: true
    dump_track_memory: true
    root: /data/ZhaoX/BoxFusion/logs/scannet_s2_yoloe_direct_shadow_score05/diagnostics
    point_count: 512

vis:
  rerun: false
  show_class: false
  show_label: false
  trajectory: true

eval: true
